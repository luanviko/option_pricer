[project]
name = "option_pricer"
version = "0.1.0"
description = "Pricing vanilla and exotic options using Monte Carlo simulations and the Black-Scholes model."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "streamlit>=1.38",
    "yfinance>=0.2.40",
    "plotly>=5.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff>=0.5",
    "mypy>=1.10",
    "jupyter>=1.1.1",
    "ipykernel>=6.29",    
]